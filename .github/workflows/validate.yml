name: Validate plugin

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact version, at least two weeks old when pinned; 2.1.281 or later is needed for the MCP checks
  # and the directory listing fields in plugin.json. Raise it on purpose, not automatically.
  CLAUDE_CODE_VERSION: '2.1.284'
  DISABLE_AUTOUPDATER: '1'
  CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: '1'

jobs:
  validate:
    name: Validate plugin and marketplace
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Structure and content tests
        run: node --test tests/plugin.test.mjs

      - name: Install the Claude Code CLI (pinned)
        run: npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"

      - name: Validate the plugin (strict)
        run: claude plugin validate ./plugins/complyeasyai --strict

      - name: Validate the marketplace (strict)
        run: claude plugin validate . --strict
